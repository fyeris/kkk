<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Studio - プロトタイプ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Markdown Parser (Marked.js) & Sanitizer (DOMPurify) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }

        /* 背景デザインバリエーション */
        /* 1. ミニマル・クリーン (Light) / モダン・ダーク (Dark) */
        .bg-theme-minimal {
            background-color: #f8fafc;
        }
        .dark .bg-theme-minimal {
            background-color: #0f172a;
        }

        /* 2. グラスモーフィズム × オーロラ */
        .bg-theme-aurora {
            background-color: #f0f4f8;
            background-image: 
                radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 85%, rgba(14, 165, 233, 0.18) 0px, transparent 50%);
        }
        .dark .bg-theme-aurora {
            background-color: #090d16;
            background-image: 
                radial-gradient(at 15% 15%, rgba(79, 70, 229, 0.25) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(219, 39, 119, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 85%, rgba(2, 132, 199, 0.25) 0px, transparent 50%);
        }

        /* 3. ドットマトリクス */
        .bg-theme-dots {
            background-color: #fafafa;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 22px 22px;
        }
        .dark .bg-theme-dots {
            background-color: #111827;
            background-image: radial-gradient(#334155 1.2px, transparent 1.2px);
            background-size: 22px 22px;
        }

        /* アニメーション */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-message {
            animation: fadeSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* タイピングインジケーター（3つのドット） */
        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Markdownコンテンツのスタイリング */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.65; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 700;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body h1 { font-size: 1.25rem; }
        .markdown-body h2 { font-size: 1.125rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body code:not(pre code) {
            background-color: rgba(148, 163, 184, 0.2);
            padding: 0.15rem 0.35rem;
            border-radius: 0.375rem;
            font-size: 0.875em;
            font-family: monospace;
        }
        .markdown-body pre {
            position: relative;
            margin: 0.75rem 0;
            border-radius: 0.75rem;
            overflow: hidden;
            background-color: #1e293b !important;
        }
        .markdown-body pre code {
            display: block;
            padding: 1rem;
            overflow-x: auto;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        .markdown-body blockquote {
            border-left: 4px solid #6366f1;
            padding-left: 1rem;
            color: #94a3b8;
            font-style: italic;
            margin: 0.75rem 0;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.75rem 0;
            font-size: 0.875rem;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid rgba(148, 163, 184, 0.3);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        .markdown-body th {
            background-color: rgba(148, 163, 184, 0.1);
        }
    </style>
</head>
<body class="bg-theme-aurora text-slate-800 dark:text-slate-100 transition-colors duration-300 h-[100dvh] flex overflow-hidden select-none sm:select-auto">

    <!-- モバイル用オーバーレイ -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-20 hidden md:hidden transition-opacity"></div>

    <!-- サイドバー（会話履歴・設定） -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-r border-slate-200/80 dark:border-slate-800/80 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <!-- サイドバーヘッダー -->
        <div class="p-4 flex items-center justify-between border-b border-slate-200/60 dark:border-slate-800/60">
            <button id="newChatBtn" class="flex-1 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm transition-all active:scale-95 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>新しいチャット</span>
            </button>
            <button id="closeSidebarBtn" class="md:hidden ml-2 p-2.5 rounded-xl text-slate-500 hover:bg-slate-200/50 dark:hover:bg-slate-800">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- 会話履歴リスト -->
        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="historyList">
            <!-- JSで動的に履歴アイテムを追加 -->
        </div>

        <!-- サイドバーフッター（背景デザイン・テーマ切り替え） -->
        <div class="p-4 border-t border-slate-200/60 dark:border-slate-800/60 space-y-3 bg-slate-50/50 dark:bg-slate-950/30">
            <div>
                <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5 block">背景デザイン</label>
                <div class="grid grid-cols-3 gap-1.5">
                    <button data-bg="bg-theme-aurora" class="bg-preset-btn active-bg py-1.5 px-2 text-xs font-medium rounded-lg border border-indigo-500 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 transition-all cursor-pointer">オーロラ</button>
                    <button data-bg="bg-theme-minimal" class="bg-preset-btn py-1.5 px-2 text-xs font-medium rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-200/50 dark:hover:bg-slate-800 transition-all cursor-pointer">ミニマル</button>
                    <button data-bg="bg-theme-dots" class="bg-preset-btn py-1.5 px-2 text-xs font-medium rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-200/50 dark:hover:bg-slate-800 transition-all cursor-pointer">ドット</button>
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <div class="flex items-center gap-2 text-xs font-medium px-2.5 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-700 dark:text-emerald-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>ローカルAIモード稼働中</span>
                </div>
                <button id="themeToggleBtn" class="p-2 rounded-xl bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300/70 dark:hover:bg-slate-700 transition-colors cursor-pointer" title="ダーク/ライトモード切替">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-slate-700"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- メインチャットエリア -->
    <main class="flex-1 flex flex-col h-full min-w-0 relative">
        <!-- ヘッダー -->
        <header class="h-14 px-4 border-b border-slate-200/60 dark:border-slate-800/60 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md flex items-center justify-between shrink-0 z-10">
            <div class="flex items-center gap-3">
                <button id="openSidebarBtn" class="md:hidden p-2 -ml-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-sm">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <h1 id="currentChatTitle" class="font-semibold text-sm sm:text-base truncate max-w-[150px] sm:max-w-xs">新しいチャット</h1>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- 動作モードバッジ（ヘッダー） -->
                <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium border border-emerald-200/80 dark:border-emerald-800/60 bg-emerald-50/70 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="hidden sm:inline">APIキー不要（デモAI）</span>
                    <span class="sm:hidden">デモAI</span>
                </div>
                <button id="clearChatBtn" class="p-2 rounded-xl text-slate-500 hover:text-rose-500 hover:bg-rose-500/10 transition-colors cursor-pointer" title="現在の会話をクリア">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- チャットメッセージ表示エリア -->
        <div id="chatContainer" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-6 scroll-smooth">
            <!-- ウェルカムスクリーン（メッセージが空の時に表示） -->
            <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center max-w-2xl mx-auto text-center px-4 animate-message">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg mb-6">
                    <i data-lucide="bot" class="w-9 h-9"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-500">
                    今日はどのようなお手伝いができますか？
                </h2>
                <p class="text-sm sm:text-base text-slate-500 dark:text-slate-400 mb-8">
                    質問、アイデア出し、プログラミングのコード作成など、何でも気軽に話しかけてください。
                </p>

                <!-- プロンプトサジェストカード -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full text-left">
                    <button class="suggestion-btn p-4 rounded-2xl bg-white/70 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 backdrop-blur-md transition-all shadow-xs hover:shadow-md group cursor-pointer">
                        <div class="flex items-center gap-2 text-indigo-500 font-semibold text-sm mb-1">
                            <i data-lucide="code-2" class="w-4 h-4"></i>
                            <span>コードの解説と作成</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">JavaScriptで配列の重複を削除するモダンな書き方を教えて</p>
                    </button>

                    <button class="suggestion-btn p-4 rounded-2xl bg-white/70 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 backdrop-blur-md transition-all shadow-xs hover:shadow-md group cursor-pointer">
                        <div class="flex items-center gap-2 text-purple-500 font-semibold text-sm mb-1">
                            <i data-lucide="lightbulb" class="w-4 h-4"></i>
                            <span>アイデアのブレインストーミング</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">週末に作れる面白い個人開発Webアプリのアイデアを3つ出して</p>
                    </button>

                    <button class="suggestion-btn p-4 rounded-2xl bg-white/70 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 backdrop-blur-md transition-all shadow-xs hover:shadow-md group cursor-pointer">
                        <div class="flex items-center gap-2 text-emerald-500 font-semibold text-sm mb-1">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                            <span>文章の要約・構成</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">新しいAIサービスのプレスリリース構成案を作成して</p>
                    </button>

                    <button class="suggestion-btn p-4 rounded-2xl bg-white/70 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 backdrop-blur-md transition-all shadow-xs hover:shadow-md group cursor-pointer">
                        <div class="flex items-center gap-2 text-amber-500 font-semibold text-sm mb-1">
                            <i data-lucide="table" class="w-4 h-4"></i>
                            <span>比較表の作成</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">React、Vue、Svelteの特徴をMarkdownの表で比較して</p>
                    </button>
                </div>
            </div>

            <!-- メッセージリストコンテナ -->
            <div id="messagesList" class="max-w-3xl mx-auto space-y-6 hidden pb-4">
                <!-- JSで動的にメッセージバブルを追加 -->
            </div>
        </div>

        <!-- 入力フォームエリア -->
        <footer class="p-3 sm:p-4 bg-gradient-to-t from-white/90 via-white/70 to-transparent dark:from-slate-950/90 dark:via-slate-950/70 dark:to-transparent shrink-0">
            <div class="max-w-3xl mx-auto">
                <form id="chatForm" class="relative flex items-end gap-2 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-slate-300/80 dark:border-slate-700/80 rounded-2xl p-2 shadow-lg focus-within:ring-2 focus-within:ring-indigo-500/50 focus-within:border-indigo-500 transition-all">
                    <textarea 
                        id="messageInput" 
                        rows="1" 
                        placeholder="AIにメッセージを送信... (Shift + Enter で改行)" 
                        class="w-full max-h-40 bg-transparent border-0 focus:ring-0 resize-none py-2.5 px-3 text-sm sm:text-base text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 leading-relaxed outline-none"
                    ></textarea>
                    
                    <button 
                        type="submit" 
                        id="sendBtn"
                        disabled
                        class="p-2.5 rounded-xl bg-indigo-600 text-white disabled:bg-slate-300 dark:disabled:bg-slate-800 disabled:text-slate-500 hover:bg-indigo-700 transition-all shrink-0 cursor-pointer disabled:cursor-not-allowed shadow-xs"
                        title="送信 (Enter)"
                    >
                        <i data-lucide="send-horizontal" class="w-5 h-5"></i>
                    </button>
                </form>
                <p class="text-[11px] text-center text-slate-400 dark:text-slate-500 mt-2">
                    AIは不正確な情報を表示することがあります。重要な情報は確認してください。
                </p>
            </div>
        </footer>
    </main>

    <!-- カスタム通知トースト（alert()の代替） -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 dark:bg-slate-700 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span id="toastMessage">コピーしました</span>
    </div>

    <script>
        /**
         * AIチャット アプリケーション ロジック（APIキー不要・スタンドアロン版）
         * ブラウザ単体で動作する内蔵AI応答エンジンを搭載し、Markdown・コードブロック・履歴保存を体験可能
         */

        // ==========================================
        // 1. 状態管理 (State) & 定数
        // ==========================================
        const STORAGE_KEY = "ai_chat_standalone_sessions_v1";

        let sessions = [];          // 全チャットセッションの配列
        let currentSessionId = null;// 現在開いているセッションID
        let isGenerating = false;   // AI応答生成中フラグ

        // 追跡防止機能（Tracking Prevention）等でlocalStorageがブロックされた場合の安全なラッパー
        const safeStorage = {
            memoryFallback: {},
            getItem(key) {
                try {
                    return window.localStorage.getItem(key);
                } catch (e) {
                    return this.memoryFallback[key] || null;
                }
            },
            setItem(key, value) {
                try {
                    window.localStorage.setItem(key, value);
                } catch (e) {
                    this.memoryFallback[key] = value;
                }
            },
            removeItem(key) {
                try {
                    window.localStorage.removeItem(key);
                } catch (e) {
                    delete this.memoryFallback[key];
                }
            }
        };

        // ==========================================
        // 2. DOM要素の取得
        // ==========================================
        const elements = {
            body: document.body,
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay'),
            openSidebarBtn: document.getElementById('openSidebarBtn'),
            closeSidebarBtn: document.getElementById('closeSidebarBtn'),
            newChatBtn: document.getElementById('newChatBtn'),
            historyList: document.getElementById('historyList'),
            themeToggleBtn: document.getElementById('themeToggleBtn'),
            bgPresetBtns: document.querySelectorAll('.bg-preset-btn'),
            currentChatTitle: document.getElementById('currentChatTitle'),
            clearChatBtn: document.getElementById('clearChatBtn'),
            chatContainer: document.getElementById('chatContainer'),
            welcomeScreen: document.getElementById('welcomeScreen'),
            messagesList: document.getElementById('messagesList'),
            chatForm: document.getElementById('chatForm'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            suggestionBtns: document.querySelectorAll('.suggestion-btn'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage')
        };

        // ==========================================
        // 3. 初期化処理
        // ==========================================
        function init() {
            lucide.createIcons();
            configureMarked();
            loadSessions();
            setupEventListeners();

            // セッションがなければ新規作成、あれば最新のものを開く
            if (sessions.length === 0) {
                createNewSession();
            } else {
                switchSession(sessions[0].id);
            }
        }

        // Marked.js（Markdownパーサー）の初期設定
        function configureMarked() {
            marked.setOptions({
                breaks: true, // 改行を<br>に変換
                gfm: true,    // GitHub Flavored Markdown有効化
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                }
            });
        }

        // ==========================================
        // 4. セッション・履歴管理 (safeStorage)
        // ==========================================
        function loadSessions() {
            try {
                const saved = safeStorage.getItem(STORAGE_KEY);
                if (saved) {
                    sessions = JSON.parse(saved);
                }
            } catch (e) {
                sessions = [];
            }
        }

        function saveSessions() {
            try {
                safeStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
                renderHistoryList();
            } catch (e) {
                renderHistoryList();
            }
        }

        // 新しいチャットセッションを作成
        function createNewSession() {
            if (isGenerating) return;
            const newSession = {
                id: 'session_' + Date.now(),
                title: '新しいチャット',
                messages: [],
                updatedAt: Date.now()
            };
            sessions.unshift(newSession);
            saveSessions();
            switchSession(newSession.id);
            closeMobileSidebar();
        }

        // 指定したセッションに切り替え
        function switchSession(sessionId) {
            if (isGenerating) return;
            currentSessionId = sessionId;
            const session = getCurrentSession();
            if (!session) return;

            elements.currentChatTitle.textContent = session.title;
            renderHistoryList();
            renderMessages();
            closeMobileSidebar();
        }

        // セッションを削除
        function deleteSession(sessionId, event) {
            event.stopPropagation();
            if (isGenerating) return;

            sessions = sessions.filter(s => s.id !== sessionId);
            saveSessions();

            if (sessions.length === 0) {
                createNewSession();
            } else if (currentSessionId === sessionId) {
                switchSession(sessions[0].id);
            }
            showToast("チャットを削除しました");
        }

        // 現在アクティブなセッションを取得
        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId);
        }

        // ==========================================
        // 5. UI描画ロジック
        // ==========================================
        // サイドバーの履歴リスト描画
        function renderHistoryList() {
            elements.historyList.innerHTML = '';
            sessions.forEach(session => {
                const isActive = session.id === currentSessionId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl text-sm cursor-pointer transition-all ${
                    isActive 
                        ? 'bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 font-medium' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/60'
                }`;
                item.onclick = () => switchSession(session.id);

                item.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0">
                        <i data-lucide="message-square" class="w-4 h-4 shrink-0 ${isActive ? 'text-indigo-500' : 'opacity-60'}"></i>
                        <span class="truncate">${escapeHtml(session.title)}</span>
                    </div>
                    <button class="delete-session-btn opacity-0 group-hover:opacity-100 p-1 rounded-lg hover:bg-rose-500/20 hover:text-rose-500 transition-opacity" title="削除">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                `;

                const deleteBtn = item.querySelector('.delete-session-btn');
                deleteBtn.onclick = (e) => deleteSession(session.id, e);

                elements.historyList.appendChild(item);
            });
            lucide.createIcons();
        }

        // メイン画面のメッセージ一覧を描画
        function renderMessages() {
            const session = getCurrentSession();
            elements.messagesList.innerHTML = '';

            if (!session || session.messages.length === 0) {
                elements.welcomeScreen.classList.remove('hidden');
                elements.messagesList.classList.add('hidden');
                return;
            }

            elements.welcomeScreen.classList.add('hidden');
            elements.messagesList.classList.remove('hidden');

            session.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.text, false);
            });

            scrollToBottom();
        }

        // 1件のメッセージバブルをDOMに追加
        function appendMessageToDOM(role, text, animate = true) {
            elements.welcomeScreen.classList.add('hidden');
            elements.messagesList.classList.remove('hidden');

            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-3 sm:gap-4 ${isUser ? 'justify-end' : 'justify-start'} ${animate ? 'animate-message' : ''}`;

            if (isUser) {
                // ユーザー側のメッセージバブル（右寄せ）
                wrapper.innerHTML = `
                    <div class="max-w-[85%] sm:max-w-[75%] bg-indigo-600 text-white px-4 py-3 rounded-2xl rounded-tr-xs shadow-sm text-sm sm:text-base leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(text)}</div>
                `;
            } else {
                // AI側のメッセージ（左寄せ・Markdown描画）
                const rawHtml = marked.parse(text);
                const cleanHtml = DOMPurify.sanitize(rawHtml);

                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shrink-0 mt-1 shadow-xs">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1 min-w-0 max-w-[88%] sm:max-w-[82%] bg-white/80 dark:bg-slate-800/75 backdrop-blur-md border border-slate-200/70 dark:border-slate-700/70 px-4 py-3.5 rounded-2xl rounded-tl-xs shadow-xs text-sm sm:text-base">
                        <div class="markdown-body break-words">${cleanHtml}</div>
                    </div>
                `;

                // コードブロックにコピーボタンを動的追加
                const preBlocks = wrapper.querySelectorAll('pre');
                preBlocks.forEach(pre => {
                    const codeEl = pre.querySelector('code');
                    const codeText = codeEl ? codeEl.innerText : pre.innerText;

                    const headerBar = document.createElement('div');
                    headerBar.className = 'flex items-center justify-between px-3 py-1.5 bg-slate-900 text-slate-400 text-xs border-b border-slate-700/80';
                    headerBar.innerHTML = `
                        <span class="font-mono">code</span>
                        <button type="button" class="copy-code-btn flex items-center gap-1 hover:text-white transition-colors cursor-pointer">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span>コピー</span>
                        </button>
                    `;

                    const copyBtn = headerBar.querySelector('.copy-code-btn');
                    copyBtn.onclick = () => copyToClipboard(codeText);

                    pre.insertBefore(headerBar, pre.firstChild);
                });
            }

            elements.messagesList.appendChild(wrapper);
            lucide.createIcons();
            scrollToBottom();
        }

        // ローディングインジケーター（AI思考中）を追加
        function appendLoadingIndicator() {
            const loader = document.createElement('div');
            loader.id = 'aiLoadingIndicator';
            loader.className = 'flex gap-3 sm:gap-4 justify-start animate-message';
            loader.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shrink-0 mt-1 shadow-xs">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </div>
                <div class="bg-white/80 dark:bg-slate-800/75 backdrop-blur-md border border-slate-200/70 dark:border-slate-700/70 px-4 py-3.5 rounded-2xl rounded-tl-xs flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-indigo-500 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-indigo-500 typing-dot"></span>
                </div>
            `;
            elements.messagesList.appendChild(loader);
            lucide.createIcons();
            scrollToBottom();
        }

        // ローディングインジケーターを削除
        function removeLoadingIndicator() {
            const loader = document.getElementById('aiLoadingIndicator');
            if (loader) loader.remove();
        }

        // チャットエリア最下部へ自動スクロール
        function scrollToBottom() {
            elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
        }

        // ==========================================
        // 6. スタンドアロンAI応答生成エンジン（APIキー不要）
        // ==========================================
        async function handleSendMessage(text) {
            const trimmed = text.trim();
            if (!trimmed || isGenerating) return;

            const session = getCurrentSession();
            if (!session) return;

            // 初回メッセージならチャットタイトルを自動設定
            if (session.messages.length === 0) {
                session.title = trimmed.length > 22 ? trimmed.substring(0, 22) + '...' : trimmed;
                elements.currentChatTitle.textContent = session.title;
            }

            // ユーザーメッセージを追加・描画
            session.messages.push({ role: 'user', text: trimmed });
            session.updatedAt = Date.now();
            saveSessions();
            appendMessageToDOM('user', trimmed, true);

            // 入力欄リセット
            elements.messageInput.value = '';
            elements.messageInput.style.height = 'auto';
            updateSendButtonState();

            // 生成中状態へ移行
            isGenerating = true;
            updateSendButtonState();
            appendLoadingIndicator();

            // リアルな思考時間をシミュレート（600ms〜1100ms）
            const thinkingTime = 600 + Math.floor(Math.random() * 500);
            await new Promise(resolve => setTimeout(resolve, thinkingTime));

            const aiResponseText = generateLocalAIResponse(trimmed, session.messages);
            
            removeLoadingIndicator();
            session.messages.push({ role: 'model', text: aiResponseText });
            session.updatedAt = Date.now();
            saveSessions();
            appendMessageToDOM('model', aiResponseText, true);

            isGenerating = false;
            updateSendButtonState();
            elements.messageInput.focus();
        }

        // ユーザーの入力内容に応じたリッチMarkdown応答を生成
        function generateLocalAIResponse(prompt, history) {
            const lower = prompt.toLowerCase();

            // 1. コード・JavaScript・重複削除の質問
            if (lower.includes('javascript') || lower.includes('重複') || lower.includes('コード') || lower.includes('プログラム')) {
                return `### JavaScriptで配列の重複を削除する方法

モダンなJavaScript（ES6以降）では、\`Set\` オブジェクトとスプレッド構文（\`...\`）を組み合わせるのが最もシンプルで高速です。

\`\`\`javascript
// 重複を含む配列
const numbers = [1, 2, 2, 3, 4, 4, 5];

// Setを使って重複を除去
const uniqueNumbers = [...new Set(numbers)];

console.log(uniqueNumbers);
// 出力: [1, 2, 3, 4, 5]
\`\`\`

#### オブジェクト配列の重複を削除したい場合
特定のプロパティ（例: \`id\`）を基準にする場合は \`Map\` を活用します。

\`\`\`javascript
const users = [
  { id: 1, name: '田中' },
  { id: 2, name: '佐藤' },
  { id: 1, name: '田中' }
];

const uniqueUsers = Array.from(
  new Map(users.map(user => [user.id, user])).values()
);
\`\`\`

> 💡 右上の **「コピー」** ボタンをクリックすると、コードをそのままクリップボードにコピーできます！`;
            }

            // 2. アイデア出し・個人開発の質問
            if (lower.includes('アイデア') || lower.includes('個人開発') || lower.includes('アプリ')) {
                return `### 週末に作れる個人開発Webアプリのアイデア3選

短期間で完成でき、ポートフォリオとしても映えるアイデアをご提案します。

1. **ポモドーロ × 環境音ミキサー**
   * **概要**: 25分集中＋5分休憩のタイマーに、「雨音」「カフェの雑音」「焚き火」などの音量スライダーを組み合わせた作業用ツール。
   * **技術ポイント**: Web Audio API と CSSアニメーションの活用。

2. **Markdownメモ → スライド即時変換ツール**
   * **概要**: 左側にMarkdownで箇条書きを入力すると、右側でプレゼン用スライドにリアルタイム変換されるWebアプリ。
   * **技術ポイント**: \`---\` 区切りでのページ分割ロジックとキーボード操作。

3. **レシート・割り勘スマート計算機**
   * **概要**: 飲み会や旅行で「誰がいくら立て替えたか」を入力すると、最小回数の送金ルートを自動計算するアプリ。
   * **技術ポイント**: グラフ理論（貪欲法）による精算アルゴリズムの実装。

気になるアイデアがあれば、画面設計やコードの雛形も作成できますよ！`;
            }

            // 3. プレスリリース・文章作成の質問
            if (lower.includes('プレスリリース') || lower.includes('文章') || lower.includes('要約') || lower.includes('構成')) {
                return `### 新規AIサービス プレスリリース構成案

そのまま使える標準的な構成テンプレートを作成しました。

#### 1. キャッチコピー・タイトル
**【新サービス】日々の思考を整理する次世代AIチャットスタジオを提供開始**
〜ブラウザだけで完結、直感的なUIでアイデア出しからコード作成まで強力にサポート〜

#### 2. リード文（要約）
株式会社〇〇は、2026年11月14日より、誰でも手軽に利用できる新しいAIチャットWebアプリケーションの提供を開始いたします。

#### 3. 開発の背景と課題
* 従来のツールは設定が複雑で、導入のハードルが高かった
* ダークモードや背景カスタマイズなど、長時間使っても疲れにくいUIが求められていた

#### 4. 主な特徴（3つのポイント）
1. **即時起動・API設定不要の軽快な動作**
2. **Markdown・シンタックスハイライト標準対応**
3. **3種類の背景デザイン（オーロラ／ミニマル／ドット）をワンクリック切替**`;
            }

            // 4. 比較表・フレームワークの質問
            if (lower.includes('比較') || lower.includes('react') || lower.includes('vue') || lower.includes('svelte') || lower.includes('表')) {
                return `### フロントエンドフレームワーク比較表（React / Vue / Svelte）

主要な3つのフレームワークの特徴をMarkdownのテーブルでまとめました。

| 比較項目 | React | Vue.js | Svelte |
| :--- | :--- | :--- | :--- |
| **開発元** | Meta (Facebook) | Evan You & コミュニティ | Rich Harris & Vercel |
| **仮想DOM** | あり | あり | **なし（コンパイル時に最適化）** |
| **学習コスト** | やや高め（JSX・Hooksの理解が必要） | 低め（HTMLに近いテンプレート構文） | **非常に低い（素のHTML/CSS/JSに近い）** |
| **エコシステム** | 最大規模・求人数も最多 | 充実（公式ルーティング・状態管理あり） | 急成長中（SvelteKitが人気） |
| **おすすめ用途** | 大規模開発・チーム開発 | 中〜大規模開発・素早い立ち上げ | 高速なWebアプリ・個人開発 |

**選び方の目安**:
* 仕事や大規模開発を見据えるなら **React**
* 書きやすさと機能のバランスを重視するなら **Vue.js**
* 軽快な動作とシンプルな記述を好むなら **Svelte** がおすすめです！`;
            }

            // 5. 挨拶への応答
            if (lower.includes('こんにちは') || lower.includes('はじめまして') || lower.includes('こんばんは') || lower.includes('おはよう')) {
                return `こんにちは！**AI Chat Studio（API不要・スタンドアロン版）**へようこそ 👋

このチャットは外部サーバーやAPIキーの設定なしで、ブラウザ単体で動作するように設計されています。

以下のような機能をお試しいただけます：
* **Markdown表示**: 見出し・箇条書き・太字・引用などの自動整形
* **コード表示**: 「JavaScriptのコードを書いて」と送ると色付きのコードブロックとコピーボタンを表示
* **表の作成**: 「ReactとVueを比較して」と送ると綺麗なテーブルを描画
* **UIカスタマイズ**: 左サイドバーから背景デザイン（オーロラ／ミニマル／ドット）やライト／ダークモードの切り替え

何か試してみたい質問はありますか？`;
            }

            // 6. その他の一般的な入力に対する応答（会話文脈も反映）
            const turnCount = Math.ceil(history.length / 2);
            return `「**${escapeHtml(prompt)}**」についてのご質問ですね！（会話ターン数: ${turnCount}）

現在このアプリは **APIキー不要のローカルデモモード** で動作しているため、外部AIサーバーへの通信は行わず、ブラウザ内の応答エンジンから回答を返しています。

#### 💡 リッチ表示を試すキーワード例
以下のキーワードを含めて送信すると、専用のMarkdownレイアウトを確認できます：
* 「**コード**」や「**JavaScript**」 → シンタックスハイライト＆コピーボタン付きコードを表示
* 「**比較**」や「**表**」 → Markdownテーブル（比較表）を表示
* 「**アイデア**」 → 箇条書きの企画リストを表示
* 「**プレスリリース**」 → ビジネス文書構成テンプレートを表示

また、左下のボタンから**背景デザイン**や**ダーク／ライトモード**の切り替えもぜひお試しください！`;
        }

        // ==========================================
        // 7. イベントリスナー & ユーティリティ
        // ==========================================
        function setupEventListeners() {
            // フォーム送信
            elements.chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                handleSendMessage(elements.messageInput.value);
            });

            // テキストエリアの自動高さ調整 & Enter送信制御
            elements.messageInput.addEventListener('input', () => {
                elements.messageInput.style.height = 'auto';
                elements.messageInput.style.height = Math.min(elements.messageInput.scrollHeight, 160) + 'px';
                updateSendButtonState();
            });

            elements.messageInput.addEventListener('keydown', (e) => {
                // IME変換中（日本語入力の確定Enter）は無視
                if (e.isComposing) return;
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage(elements.messageInput.value);
                }
            });

            // サジェストカードクリック
            elements.suggestionBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const promptText = btn.querySelector('p').innerText;
                    handleSendMessage(promptText);
                });
            });

            // 新規チャット作成
            elements.newChatBtn.addEventListener('click', createNewSession);

            // 現在の会話クリア
            elements.clearChatBtn.addEventListener('click', () => {
                const session = getCurrentSession();
                if (!session || session.messages.length === 0 || isGenerating) return;
                session.messages = [];
                session.title = '新しいチャット';
                elements.currentChatTitle.textContent = session.title;
                saveSessions();
                renderMessages();
                showToast("会話をクリアしました");
            });

            // ダークモード / ライトモード切替
            elements.themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // 背景デザインプリセット切替
            elements.bgPresetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const bgClass = btn.getAttribute('data-bg');
                    elements.body.classList.remove('bg-theme-aurora', 'bg-theme-minimal', 'bg-theme-dots');
                    elements.body.classList.add(bgClass);

                    // ボタンのアクティブスタイル更新
                    elements.bgPresetBtns.forEach(b => {
                        b.className = 'bg-preset-btn py-1.5 px-2 text-xs font-medium rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-200/50 dark:hover:bg-slate-800 transition-all cursor-pointer';
                    });
                    btn.className = 'bg-preset-btn py-1.5 px-2 text-xs font-medium rounded-lg border border-indigo-500 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 transition-all cursor-pointer';
                });
            });

            // モバイルサイドバー開閉
            elements.openSidebarBtn.addEventListener('click', () => {
                elements.sidebar.classList.remove('-translate-x-full');
                elements.sidebarOverlay.classList.remove('hidden');
            });

            elements.closeSidebarBtn.addEventListener('click', closeMobileSidebar);
            elements.sidebarOverlay.addEventListener('click', closeMobileSidebar);
        }

        function closeMobileSidebar() {
            elements.sidebar.classList.add('-translate-x-full');
            elements.sidebarOverlay.classList.add('hidden');
        }

        function updateSendButtonState() {
            const hasText = elements.messageInput.value.trim().length > 0;
            elements.sendBtn.disabled = !hasText || isGenerating;
        }

        // XSS対策用のHTMLエスケープ
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }

        // クリップボードコピー（iFrame対応）
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("コードをコピーしました");
            } catch (err) {
                showToast("コピーに失敗しました");
            }
            document.body.removeChild(textarea);
        }

        // トースト通知表示
        let toastTimeout;
        function showToast(message) {
            elements.toastMessage.textContent = message;
            elements.toast.classList.remove('opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                elements.toast.classList.add('opacity-0');
            }, 2500);
        }

        // アプリ起動
        window.addEventListener('DOMContentLoaded', init);
    </script>
